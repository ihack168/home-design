name: Check Old Posts Room Images

on:
  workflow_dispatch:

jobs:
  check-post:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show Node Version
        run: |
          node -v
          npm -v

      - name: Run Check Post
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          node .github/scripts/check-post.mjs